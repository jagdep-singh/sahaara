services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ngo
      POSTGRES_PASSWORD: ngo
      POSTGRES_DB: ngo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: ngo
      POSTGRES_PASSWORD: ngo
      POSTGRES_DB: ngo_test
    ports:
      - "5434:5432"
volumes:
  pgdata: {}
