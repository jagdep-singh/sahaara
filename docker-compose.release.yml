x-app-environment: &app-environment
  DATABASE_URL: postgresql://ngo:${POSTGRES_PASSWORD:-ngo}@db:5432/ngo
  DIRECT_URL: postgresql://ngo:${POSTGRES_PASSWORD:-ngo}@db:5432/ngo
  PG_POOL_MAX: ${PG_POOL_MAX:-10}
  AUTH_SECRET: ${AUTH_SECRET:-demo-auth-secret-change-me-32-characters}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.org}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo-admin-password}
  DEMO_OTP: ${DEMO_OTP:-123456}
  MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:-demo-webhook-secret}
  AI_MODE: ${AI_MODE:-mock}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
  TRUST_NAME: ${TRUST_NAME:-Sahaara Charitable Trust}
  TRUST_ADDRESS: ${TRUST_ADDRESS:-Placeholder address, Bhopal, Madhya Pradesh}
  TRUST_PAN: ${TRUST_PAN:-AAAAA0000A}
  TRUST_80G_REG: ${TRUST_80G_REG:-80G-PLACEHOLDER-0000}
  RECEIPT_PREFIX: ${RECEIPT_PREFIX:-80G}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ngo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ngo}
      POSTGRES_DB: ngo
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngo -d ngo"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${SAHAARA_IMAGE_PREFIX:-ghcr.io/jagdep-singh/sahaara}-migrator:${SAHAARA_IMAGE_TAG:-latest}
    environment:
      <<: *app-environment
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npm run db:seed
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${SAHAARA_IMAGE_PREFIX:-ghcr.io/jagdep-singh/sahaara}-app:${SAHAARA_IMAGE_TAG:-latest}
    environment:
      <<: *app-environment
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/hi').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata: {}
